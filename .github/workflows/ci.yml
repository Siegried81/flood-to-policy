name: tests

# Offline by design: the suite must pass with no network.
# push is limited to main: a branch with an open PR is already checked by the
# pull_request run, so pushing to it must not start the same suite twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the running checks obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI runs Python 3.12 (as the Docker image does); the local Windows venv is cp314.
  # Wheels differ per version, so a green CI does not cover cp314-only breakage.
  test:
    runs-on: ubuntu-latest
    steps:
      # lfs: the Team 9 browser tests open web/public/team9/flood_map.html, which is
      # stored in Git LFS (a pointer file is skipped, not tested).
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-test.txt
      # The browser tests of team9/tests drive Chromium through Playwright.
      - run: python -m playwright install --with-deps chromium
      # -rs prints every skip with its reason, so a silently skipped test shows up.
      - run: python -m pytest -q -rs   # tests/ and team9/tests (see pytest.ini)

  # The React UI: install, build (prebuild copies data/processed/event_2021_web.json).
  # web/ has no lint script, so there is no lint step.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # Build the code-only stage on a clean machine and check the native stack loads.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target app -t flood-to-policy:ci .
      - run: docker run --rm flood-to-policy:ci python -c "import rasterio, pyogrio, rasterstats, tiktoken; print('native stack loads')"
      # With no data in the image the readiness script must report BLOCKED and exit 1.
      - run: "! docker run --rm flood-to-policy:ci python scripts/check_offline_readiness.py"
      # The React UI is built inside the image; the API serves it at /.
      - run: docker run --rm flood-to-policy:ci test -f web/dist/index.html
