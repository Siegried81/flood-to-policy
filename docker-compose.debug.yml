# Debug override: the same services, started under debugpy so VS Code can attach.
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
#   then VS Code -> Run and Debug -> "Docker: attach ..." (F5), breakpoints work.
#
# debugpy stays out of the image (an open debug port runs arbitrary Python): it is
# installed at start into /tmp/debug, version from requirements-dev.txt; ports bind
# to 127.0.0.1; the source is mounted on /app (edit, restart, no rebuild).

services:
  app:
    # Streamlit: attach on 127.0.0.1:5678
    command: >-
      sh -c "pip install --quiet --no-cache-dir --target /tmp/debug $$(grep -i '^debugpy' requirements-dev.txt)
      && PYTHONPATH=/tmp/debug:$${PYTHONPATH:-} exec python -m debugpy --listen 0.0.0.0:5678 -m streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - .:/app

  api:
    # API (profile api): attach on 127.0.0.1:5679
    command: >-
      sh -c "pip install --quiet --no-cache-dir --target /tmp/debug $$(grep -i '^debugpy' requirements-dev.txt)
      && PYTHONPATH=/tmp/debug:$${PYTHONPATH:-} exec python -m debugpy --listen 0.0.0.0:5679 -m uvicorn api.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "127.0.0.1:5679:5679"
    volumes:
      - .:/app
