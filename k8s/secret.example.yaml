# Example Secret for flood-to-policy. Holds what the .env file used to hold.
# Copy to secret.yaml, fill in real values, apply it BEFORE flood-to-policy.yaml,
# and keep the real file out of git.
#
# Easiest: build the Secret from your .env:
#   kubectl create secret generic flood-secrets --from-env-file=../.env
#
# Or edit and apply this file:
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: flood-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
  # add any other keys your .env defines, one per line
