# Flood to policy in Linux.
#
#   docker compose up --build                            # Streamlit on :8501, ./data bind-mounted
#   docker compose --profile api up --build              # + JSON API / React UI on :8001
#   docker compose --profile tools run --rm check        # demo-ready offline?
#   docker compose --profile tools run --rm test         # full suite, geospatial included
#   docker compose --profile portable up --build         # self-contained image (data baked in)
#   docker compose --profile local-llm up --build        # + a bundled Ollama
#   docker compose --profile agent run --rm -T mcp       # MCP tools over stdio
#
# ./data is mounted read-write: src/rdh.py caches Risk Data Hub responses and
# POST /api/approve appends to data/processed/approved.md.
# Secrets come from .env at run time (optional), never from the image.

x-app-common: &app-common
  build:
    context: .
    target: app
  image: ${DOCKERHUB_USERNAME:-siegried}/flood-to-policy:latest
  env_file:
    - path: .env
      required: false
  environment:
    # Inside a container "localhost" is the container: default to the bundled
    # `ollama` service, or set OLLAMA_URL_IN_DOCKER=http://host.docker.internal:11434.
    OLLAMA_URL: ${OLLAMA_URL_IN_DOCKER:-http://ollama:11434}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data

services:
  app:
    <<: *app-common
    ports:
      - "127.0.0.1:8501:8501"  # local only: it spends the model key and writes the brief
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
        required: false  # only enforced with the `local-llm` profile

  # JSON API + the React UI built by the Dockerfile's `web` stage (web/vite.config.js proxies 8001).
  api:
    <<: *app-common
    profiles: ["api"]
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      # Probes the API alone (the image's own check passes if either server answers).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      ollama:
        condition: service_healthy
        required: false

  # Intent-based MCP tools (api/mcp_server.py): stdio, so `run -T`, not `up`.
  mcp:
    <<: *app-common
    profiles: ["agent"]
    command: ["python", "-m", "api.mcp_server"]
    stdin_open: true

  # Data baked into the image, nothing mounted: `docker save flood-to-policy:portable | gzip > kit.tar.gz`.
  portable:
    <<: *app-common
    profiles: ["portable"]
    build:
      context: .
      target: portable
    image: flood-to-policy:portable
    volumes: []
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  # One-shot; the exit code is the answer. Arguments are appended: `run --rm check --strict`.
  check:
    <<: *app-common
    profiles: ["tools"]
    entrypoint: ["python", "scripts/check_offline_readiness.py"]
    restart: "no"

  # Arguments are appended: `run --rm test -k rdh`.
  test:
    <<: *app-common
    build:
      context: .
      target: test
    image: flood-to-policy:test
    profiles: ["tools"]
    entrypoint: ["python", "-m", "pytest", "-q"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      # Starts empty: pull once with network, `docker compose --profile local-llm exec ollama ollama pull llama3.2:3b`.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_models:
