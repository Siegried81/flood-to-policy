# sources.yaml - single source of truth for every dataset and document used.
#
# Why this file exists: provenance and reproducibility. FARI's manifesto commits
# to open source and Open Science, and the jury includes JRC staff whose own
# catalogue records provenance for everything. Every number in the brief must be
# traceable to a line here. It is also DRY: URLs change, and they change in one
# place.
#
# access:
#   download = bulk file, fetched once with src/fetch.py
#   api      = query endpoint, called at runtime. Not necessarily transient:
#              `src/rdh.py` and `src/basins.py` both cache their answers under
#              `data/processed/`, because a service that is slow or needs a token
#              cannot be relied on at the event. `src/fetch.py` still skips these
#              entries, and so does `scripts/check_offline_readiness.py` - so a
#              missing api cache does NOT show up as "not demo-ready".
#   scrape   = HTML/PDF text pulled into the RAG corpus (robots.txt respected)
#   folder   = directory of files too large to mirror. Declared here for
#              provenance and skipped by src/fetch.py; the pipeline opens a
#              Belgium window at runtime through GDAL /vsicurl/ instead. A GET on
#              such a url returns the directory listing, not a file.
#
# verified: date the URL and its properties were checked against the live source.
# An unverified line is a liability on the day.

geodata:
  - id: jrc_flood_hazard
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/flood_hazard/
    # `download`, not `folder`, BECAUSE it names its files below. `folder` means
    # "declared for provenance, never mirrored, read as a /vsicurl/ window at
    # runtime" - which is Belgium-only and needs the network on the day. Naming
    # the thirteen files instead mirrors 2.79 GiB once and lets the continental
    # build read all 1,345 NUTS3 regions offline. An entry cannot be both: a
    # `folder` entry carrying a `files:` list is skipped with its files ignored.
    access: download
    crs: EPSG:4326          # NOT 3035, and NOT 100 m - see caveat
    # The url above is a DIRECTORY listing, so it is not fetchable on its own.
    # Nine return periods plus the two companion masks, measured:
    # 272,286,610 / 293,735,892 / 298,074,166 / 304,739,764 / 309,424,632 /
    # 318,236,424 / 323,117,744 / 335,098,080 / 349,928,950 B for RP10..RP500,
    # 112,287,284 B permanent water and 74,730,820 B spurious depth.
    # All nine return periods together are 2.61 GiB.
    files:
      - Europe_RP10_filled_depth.tif
      - Europe_RP20_filled_depth.tif
      - Europe_RP30_filled_depth.tif
      - Europe_RP40_filled_depth.tif
      - Europe_RP50_filled_depth.tif
      - Europe_RP75_filled_depth.tif
      - Europe_RP100_filled_depth.tif
      - Europe_RP200_filled_depth.tif
      - Europe_RP500_filled_depth.tif
      - Europe_permanent_water_bodies.tif
      - Europe_spurious_depth_areas.tif
      - README.txt
      - CHANGELOG.txt
    purpose: >
      River flood hazard maps for Europe, v3.1.1. Nine return periods:
      Europe_RP{10,20,30,40,50,75,100,200,500}_filled_depth.tif, 272-350 MB each.
      Band value is river inundation water depth in METRES. Float32, nodata -9999.
    caveat: >
      Resolution is 3 arc-seconds (0.000833333 deg) in EPSG:4326 - about 92 m
      north-south but only 60 m east-west at Belgian latitudes, so cells are NOT
      square and any area computed in 4326 is wrong. The widely-quoted
      "100 m, ETRS89-LAEA" belongs to the retired v2.x and will misalign a
      pipeline built on the current files.
      Modelled for river basins > 150 km2 only, so small Walloon tributaries are
      absent. JRC states plainly these are NOT official hazard maps.
      Tiled Deflate (256x256, 110162x51992 px, 53% of tiles empty) and the server
      honours HTTP range requests, so /vsicurl/ is the right tool FOR A COUNTRY
      WINDOW and the wrong one for the European run. Measured on
      RP100: a Belgium window is 220 tiles and 2.4 MiB over the wire, 0.76% of
      the file; the EU27+EFTA bbox is 35,525 tiles and 172 MiB, i.e. 56% of the
      file fetched in tens of thousands of requests. At this repo's own
      one-request-per-second-per-host rate that is hours per return period, so
      download the whole file for a pan-European zonal run and reserve /vsicurl/
      for the Belgian dress rehearsal.
    companions: >
      Europe_spurious_depth_areas.tif flags places where depth > 10 m is predicted
      in small channels; the README says to treat those values with caution, so
      mask or flag them. Europe_permanent_water_bodies.tif is the layer used to
      patch the depth maps.
    doi: 10.2905/1D128B6C-A4EE-4858-9E34-6210707F3C81
    licence: CC-BY-4.0
    verified: 2026-10-28

  - id: jrc_observed_flood_depth
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/European_Satellite-Derived_Flood_Depth_Maps/
    access: download
    # UNITS ARE CENTIMETRES here, against the hazard maps' METRES. Comparing the
    # two without converting is a factor-100 error that produces a plausible
    # number, which is why it is stated next to the CRS and not only in a caveat.
    crs: Equi7Grid Europe   # azimuthal equidistant; the FILE names no code - see caveat
    licence: CC-BY-4.0
    # The url above holds only README.txt, copyright.txt and maps/. The real
    # rasters are one folder per year, maps/{2015..2025}/, and 2021 alone holds
    # 352 files. File names encode the event: WD_MERGE_[start]---[end]_duration_
    # [n]_days_cluster_[id]_A0_[GFM extent km2]_A_[enhanced extent km2]_lat_
    # [centroid lat x100]_lon_[centroid lon x100]_size_[spread].tif - so the
    # Belgian July 2021 event is selectable from the name alone.
    files:
      - maps/2021/WD_MERGE_2021-07-12---2021-08-02_duration_21_days_cluster_159_A0_000619_A_000852_lat_04942_lon_00499_size_0246.tif
    purpose: >
      OBSERVED flood depth across Europe, 2015-01-01 to 2025-12-31, at 20 m -
      four times finer than the hazard maps. Estimated from Sentinel-1 SAR extent
      (Copernicus Global Flood Monitoring) plus terrain, via the FLEXTH algorithm.
      This is the validation layer: where the modelled hazard maps and a decade of
      observation disagree is a finding about the model, and the hazard maps have
      two documented blind spots (river flooding only, basins > 150 km2) to test.
      The one file listed is the July 2021 event, 38,156,787 B, 45000x60000 px
      uint16: window lat 44.47-57.05, lon -6.86-10.39, so its FOOTPRINT covers
      Belgium and the German Ahr valley. Coverage is not detection: over the Ahr
      (6.75-7.30 E, 50.35-50.60 N) only about 0.35 km2 is flagged flooded,
      consistent with a flash flood in a narrow wooded valley that drained
      between Sentinel-1 passes (a reading, not measured). So the cross-border
      validation claim this file supports is limited to Belgium; it cannot
      score the model on the German side.
    caveat: >
      Sentinel-1 sees flood EXTENT under cloud but not under dense canopy or in
      very narrow urban streets, and a revisit gap can miss a flash flood that
      drained in hours. So an absence here is weaker evidence than a presence.
      Depth is in CENTIMETRES, uint16, nodata 0, and 9999 marks permanent or
      seasonal water rather than a 99 m flood - mask it before any statistic.
      The CRS is Equi7Grid Europe, declared user-defined (ProjectedCSTypeGeoKey
      32767) with only an ESRI citation string, though pyproj resolves its WKT to EPSG:27704 ("WGS 84 / Equi7 Europe") and
      the file's own ProjCenter keys are the right way round (ProjCenterLong 24.0, ProjCenterLat 53.0). Pass the proj4
      string, not the file's keys:
      "+proj=aeqd +lat_0=53 +lon_0=24 +x_0=5837287.81977 +y_0=2121415.69617
      +datum=WGS84 +units=m".
      Stored as one-row strips (60,000 of them), not tiled, so a windowed read is
      not cheap here - but the file is only 38 MB, so just download it.
    doi: 10.2905/0bc96690-b89c-4909-9166-c2c322a20130
    verified: 2026-10-28

  - id: ghsl_pop_europe
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_1000/V1-0/GHS_POP_E2025_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # World Mollweide. "EPSG:54009" is not a valid code.
    purpose: >
      GHS-POP 1 km population grid, ONE global file (323 MB), the denominator for
      a pan-European NUTS3 analysis. At NUTS3 a region is hundreds of km2, so 1 km
      is ample, and one file removes the whole tile-mosaicking problem.
    caveat: >
      Values are residents per cell - a count, so summable, never averaged and
      never multiplied by cell area. Nodata -200.
      The GeoTIFF carries no EPSG projected code, only an ESRI WKT string, so some
      tools report an unnamed CRS. Pass the full WKT or
      "+proj=moll +lon_0=0 +datum=WGS84 +units=m", not a code.
    licence: CC-BY-4.0
    verified: 2026-10-28

  - id: ghsl_built_europe
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_1000/V1-0/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # World Mollweide, same grid as ghsl_pop_europe
    purpose: >
      GHS-BUILT-S: built-up SURFACE per 1 km cell, 2025 epoch, one global file
      (153,290,977 B). The asset half of exposure. GHS-POP answers "how many
      people are in the water"; this answers "how much is built there", which is
      the question behind every recommendation about where building is still
      permitted. Same grid, same epoch, same CRS and same cell size as
      ghsl_pop_europe, so the two divide cell by cell with no reprojection and no
      resampling - which is the whole reason for taking the 1 km Mollweide
      version rather than the 100 m tiles.
    caveat: >
      Values are square METRES of built-up surface per cell, NOT a share: divide
      by the cell area (1 km2 = 1,000,000 m2) before calling any of it a
      percentage, or every figure is out by six orders of magnitude.
      It measures footprint, not value: a warehouse and a hospital of the same
      size are the same number here. It ranks what is physically at stake, never
      what it costs - say so, because a jury will ask.
      Same Mollweide trap as GHS-POP: the GeoTIFF carries an ESRI WKT string and
      no projected EPSG code, so pass the WKT or the proj4 string, not a code.
      The non-residential variant (GHS_BUILT_S_NRES) is NOT at the mirrored path
      this entry follows - it answers 404.
    licence: CC-BY-4.0
    verified: 2026-10-28

  - id: jrc_flood_protection_standards
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/PESETAIV/Paper_floods/floodProtection_v2019_paper.zip
    landing: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/PESETAIV/Paper_floods/
    access: download
    crs: EPSG:3035          # verified on the raster 2026-10-24, 500 m cells
    purpose: >
      JRC PESETA IV flood protection standards: per 500 m cell, the return period
      the local defences are designed to hold (2 to 10,000 years). The hazard maps
      draw the water as if no dyke stood in its way, so a count of people in the
      RP100 footprint is the UNDEFENDED exposure. Masking every cell whose standard
      is at least the scenario's return period gives the residual exposure - the
      people the water still reaches once the defences hold - which is the figure
      a flood risk management plan is about. scripts/build_exposure.py --protection.
    caveat: >
      A design standard, not a guarantee: a dyke built for 1-in-100 can fail
      earlier, and the 2019 standards were derived for an older generation of the
      hazard maps than the v3.1.1 rasters in this kit. Values 2..10000, nodata -1;
      10,000 is a real standard (all 22,572 such cells are in the Netherlands, the
      coastal dyke rings), not a fill value. Where the raster has no value the
      cell is treated as unprotected, which keeps the figure an upper bound there.
      One GeoTIFF, 980,287 B zipped and about 252 MB unpacked.
    licence: CC-BY-4.0     # copyright.txt beside the file, checked 2026-10-24
    verified: 2026-10-24

  - id: ghsl_pop_europe_2010
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2010_GLOBE_R2023A_54009_1000/V1-0/GHS_POP_E2010_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # same grid as ghsl_pop_europe
    purpose: >
      GHS-POP for the 2010 epoch, on exactly the 2025 grid (317,876,163 B). With
      ghsl_built_europe_2010 it answers whether people and buildings kept moving
      into the floodplain after the Floods Directive (2007): the same footprint,
      the same masks, two epochs - an evaluation of a policy rather than a
      description of a risk.
    caveat: >
      An epoch of a modelled grid, not a census: GHSL redistributes census counts
      onto built-up surface, so a change between epochs mixes real change with
      improvements in the input data. Compare shares within a region, and quote
      the change with that caveat.
    licence: CC-BY-4.0
    verified: 2026-10-24

  - id: ghsl_built_europe_2010
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2010_GLOBE_R2023A_54009_1000/V1-0/GHS_BUILT_S_E2010_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # same grid as ghsl_built_europe
    purpose: >
      GHS-BUILT-S for the 2010 epoch (149,485,394 B), the asset half of the
      2010-to-2025 comparison above: square metres built inside the RP100
      footprint, then and now, per region.
    caveat: >
      Same units trap as ghsl_built_europe: square metres per cell, not a share.
      Same epoch caveat as ghsl_pop_europe_2010.
    licence: CC-BY-4.0
    verified: 2026-10-24

  - id: gisco_healthcare
    url: https://gisco-services.ec.europa.eu/pub/healthcare/2023_v2025_11/gpkg/EU.gpkg
    landing: https://gisco-services.ec.europa.eu/pub/healthcare/
    access: download
    crs: EPSG:4326          # GeoPackage points; read and reprojected by src/facilities.py
    purpose: >
      Eurostat GISCO hospitals, from Member States' official sources (5,697,536 B).
      Article 6(5) of the Floods Directive asks the risk maps to show the
      consequences for, among others, hospitals: this counts the hospitals inside
      each return period's flood footprint, per region. Official data, which is
      why it replaces the Overpass query for this question.
    caveat: >
      "Hospital" is defined by each Member State (metadata_v2025_11.pdf), so a
      count compares national definitions as much as hospitals - the same
      comparability problem the brief raises about the APSFR declarations. Use
      the public EU.gpkg only; the folder named EU_DONOTDISSEMINATEOUTSIDE_EC is
      not for redistribution. Licence: the GISCO terms of use (credit "Source:
      Eurostat - GISCO"), not CC BY.
    licence: GISCO terms of use
    verified: 2026-10-24

  - id: gisco_education
    url: https://gisco-services.ec.europa.eu/pub/education/2023_2026_01/gpkg/EU.gpkg
    landing: https://gisco-services.ec.europa.eu/pub/education/
    access: download
    crs: EPSG:4326
    purpose: >
      Eurostat GISCO schools and education sites (96,026,624 B), counted per
      region and return period like gisco_healthcare: a school in the footprint
      is both a consequence and a shelter that may not be usable.
    caveat: >
      Coverage and the definition of an education site vary by Member State, as
      for hospitals. GISCO terms of use, not CC BY.
    licence: GISCO terms of use
    verified: 2026-10-24

  - id: efas_flood_thresholds
    url: https://confluence.ecmwf.int/download/attachments/242067380/
    landing: https://confluence.ecmwf.int/display/CEMS/Auxiliary+Data
    access: download
    crs: EPSG:4326          # EFAS v5 grid, 1 arcmin
    files:
      - flood_threshold_efas_v5.1_rl_1.5.nc
      - flood_threshold_efas_v5.1_rl_2.0.nc
      - flood_threshold_efas_v5.1_rl_5.0.nc
      - flood_threshold_efas_v5.1_rl_10.0.nc
      - flood_threshold_efas_v5.1_rl_20.0.nc
      - flood_threshold_efas_v5.1_rl_50.0.nc
      - flood_threshold_efas_v5.1_rl_100.0.nc
      - flood_threshold_efas_v5.1_rl_200.0.nc
      - flood_threshold_efas_v5.1_rl_500.0.nc
    purpose: >
      EFAS v5.1 river-discharge return levels, one NetCDF per return period
      (1-in-1.5 to 1-in-500, about 54 MB each). With the EFAS reanalysis of July
      2021 (efas_historical_july_2021) they say where the river went past its
      1-in-100 or 1-in-500 level - the JRC's own model turning "July 2021" into
      a return period, river cell by river cell.
    caveat: >
      Fitted on 1992-01-01 to 2022-12-31 (Gumbel, L-moments), per the EFAS FAQ
      and every v5.x release page of the CEMS wiki; v5.1 is a minor release of
      the same run as the version_5_0 reanalysis on EWDS, so the two match. But
      2021 sits INSIDE the fitting window: July 2021 helped set the return levels
      it is measured against - say so beside any "1-in-N" for 2021. Every land
      cell carries a threshold; river cells come from efas_upstream_area. EFAS
      in operation in July 2021 was v4.2 (5 km), not these. Discharge in m3/s.
    licence: CEMS-FLOODS licence (credit "Contains modified Copernicus Emergency Management Service information 2026")
    verified: 2026-10-24

  - id: efas_upstream_area
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/LISFLOOD_static_and_parameter_maps_for_EFAS/v1.1.2_OS-LISFLOOD-v4.x/Catchments_morphology_and_river_network/upArea_European_01min.nc
    access: download
    crs: EPSG:4326          # EFAS v5 grid, 1 arcmin, 4530 x 2970
    purpose: >
      Upstream drainage area per EFAS v5 cell (53,893,073 B, no account): what
      tells a river cell (>= 150 km2, the floor of the hazard maps and of EFAS's
      own products) from a hillslope, since every land cell carries a return
      level. src/efas.py reads it when the EWDS field is absent.
    caveat: >
      From the open LISFLOOD static maps for EFAS v5 (OS-LISFLOOD v4.x set).
      Checked 2026-10-26: equal to the EWDS `upstream_area` v5.0 field on all
      7,446,075 valid cells of the 4530 x 2970 grid. Check units (m2) before
      thresholding.
    licence: CC-BY-4.0
    verified: 2026-10-24

  - id: emo1_precipitation_2021
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/meteorological_forcings/EMO-1arcmin/pr/EMO-1arcmin-pr_2021.nc
    access: download
    crs: EPSG:4326
    purpose: >
      EMO-1 observed daily precipitation, 1 arcmin, 2021 (351,452,529 B): the
      rain of 13-15 July 2021 per region - the surface-runoff side of the event
      that the river hazard maps leave out.
    caveat: >
      Interpolated from station observations (EFAS meteorological forcing), not
      radar. Daily totals; the peak hour is not in it.
    licence: CC-BY-4.0
    verified: 2026-10-24

  - id: efas_rapid_impact_archive
    url: https://european-flood.emergency.copernicus.eu/
    access: api
    purpose: >
      EFAS Rapid Impact Assessment archive, public after a 30-day embargo
      through the anonymous WMS layer mapserver:RapidImpactAssessment
      (GetFeatureInfo as JSON, from 2019-10-07): population affected with and
      without flood protection, per forecast. The official counterpart of the
      kit's undefended versus residual reading. Probed 2026-10-24 near Liege:
      13 July 2021 12 UTC, 170,300 protected and 259,600 unprotected.
    caveat: >
      EFAS v4.2 forecasts, 3-arcsec GHS-POP 2020, flooded from 0.099 m - a
      different threshold from the kit's 0.5 m. The response does not name its
      region; match it by location before quoting.
    verified: 2026-10-24

  - id: efas_historical_july_2021
    url: https://ewds.climate.copernicus.eu/datasets/efas-historical
    access: api
    purpose: >
      EFAS reanalysis river discharge, 6-hourly, 1 arcmin, 1-31 July 2021, for a
      box over the Meuse, Vesdre and Ahr (N52 W3 S49 E8): 124 fields by the EWDS
      costing endpoint, under the 1,500-field limit, plus the static
      upstream_area field (cost 1, whole domain, ~54 MB) that src/efas.py needs
      to tell a river cell from a hillslope - every land cell carries a
      threshold. Fetched by scripts/fetch_efas_july2021.py through the
      EWDS API with EWDS_API_KEY from .env.
    caveat: >
      Needs the user's ECMWF account and the CEMS-FLOODS licence accepted on the
      dataset page; a request without it fails with a licence error. A
      pre-event errand, never a venue fetch.
    licence: CEMS-FLOODS licence
    verified: 2026-10-24

  - id: hera_sealed_fraction
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/HERA/VER1-0/Data/NetCDF/socioeconomic_maps/landuse/
