  # Observed July 2021 flooding, from the region itself - a SECOND ground truth,
  # independent of Copernicus EMSR518. Two sources that overlap are what turns
  # "the model captures X%" into a defensible result rather than an artefact of
  # one delineation. Both CC-BY 4.0, same download mechanism as the hazard series.
  - id: wallonia_observed_flooded_areas_2021
    url: https://geoservices.wallonie.be/geotraitement/spwdatadownload/results/5fa27752-74a6-4cf5-bfb9-d0d5d7e9d35c/
    access: download
    crs: EPSG:31370
    licence: CC-BY-4.0
    files:
      - ZONES_INONDEES_202107_GEOPACKAGE_31370.zip      # 49,548,426 B
    purpose: >
      "Cartographie des zones inondees - juillet 2021": the extent the Walloon
      administration recorded, to be scored against EMSR518 before either is
      scored against the hazard maps. Where the two observations disagree is the
      uncertainty of the ground truth itself, which belongs in the brief.
      It is NOT the same footprint as the IDW depth raster beside it. This gpkg is
      208,012 polygons that dissolve to about 521 km2 (533 km2 before
      dissolve: polygons overlap). Only 30,670 of them (about 53 km2) carry
      one of the 17 named SCENARIO zones - the Vesdre, Ourthe, Meuse, Lesse,
      Lhomme, Wamme, Hoegne, Eau d'Heure, Mehaigne and Limbourg, but also the
      Dyle, Senne and Grande/Petite Gette; SCENARIO is empty on the other
      177,342 (about 480 km2), so it is not a zone key for the layer. The IDW
      depth raster has depth > 0 on about 77 km2, which tracks the polygons
      whose IDW_SCENARIO is set (Interpolation/Extrapolation, about 78 km2). Scored by scripts/validate_2021.py on one 20 m EPSG:3035
      grid over the Wallonia window, the Walloon ALEA x10-x30 classes catch 72.8%
      of the depth raster's cells but 34.3% of this extent's (88.4% against 41.2%
      with tres faible): hit rates differ by about 2.1x depending on which
      Walloon truth is used (3.3x for JRC RP100). Name the truth beside
      every hit rate, and never pool the two.
    verified: null

