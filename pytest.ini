[pytest]
# `tests/` is this kit's suite; `team9/tests` is Team 9's map tool (needs the extras in
# requirements-test.txt; its browser tests read team9/flood_map.html or the LFS copy in
# web/public/team9/ and skip only when both are missing or a pointer, or without
# playwright; the tests that need the Google Cloud cache skip when it is empty).
testpaths = tests team9/tests

# rasterstats 0.21 still computes `affine * (col, row)`, which affine deprecates in
# favour of `@`. It fires twice per zonal call (about 1,140 times per run) and buries
# any warning raised by this repo's own code. The filter is pinned to that message
# in that module, so the same deprecation anywhere else still shows.
filterwarnings =
    ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning:rasterstats.io
# langsmith's beta decorator calls asyncio.iscoroutinefunction, deprecated on Python 3.14,
# once per decorated function at import. Pinned to that module for the same reason.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith._internal._beta_decorator
