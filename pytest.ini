[pytest]
# Collect only this project's own suite. `team9/` vendors Team 9's FARI tool with
# its own pytest suite (node, scipy and a headless browser; some tests reach the
# network), run from inside `team9/` with its own README, not as part of this kit.
# Without this, a bare `pytest` (CI, docker-compose, scripts/docs_numbers.py) would
# descend into `team9/tests` and hang on its imports, and the doc test count would
# drift. Explicit paths (e.g. `pytest team9/tests`) still work.
testpaths = tests

# rasterstats 0.21 still computes `affine * (col, row)`, which affine deprecates in
# favour of `@`. It fires twice per zonal call (about 1,140 times per run) and buries
# any warning raised by this repo's own code. The filter is pinned to that message
# in that module, so the same deprecation anywhere else still shows.
filterwarnings =
    ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning:rasterstats.io
